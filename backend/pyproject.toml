[build-system]
# Pinned: an unpinned hatchling broke the image build once (#54).
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "openclef"
version = "0.0.1"
description = "Self-hosted sheet music library manager"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "meklab" }]

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "structlog==24.4.0",
    "dramatiq[redis]==1.17.1",
    "redis==5.2.1",
    "argon2-cffi==23.1.0",
    "itsdangerous==2.2.0",
    # Async filesystem IO for the LocalStorage backend; keeps PDF
    # uploads/streams off the event loop's blocking IO path.
    "aiofiles==24.1.0",
    # Async S3 client used by S3Storage. Wraps botocore so the event
    # loop stays unblocked under upload load (boto3-via-executor would
    # tax the default thread pool).
    "aioboto3==13.3.0",
    # PDF page count + embedded Info/XMP metadata at upload time (pure Python).
    "pypdf==6.20.1",
    # First-page thumbnail render in the Dramatiq worker (bundles PDFium).
    "pypdfium2==5.14.0",
    # PNG encoding for rendered thumbnails.
    "pillow==12.3.0",
    # Multipart form parsing for PDF uploads (FastAPI File/Form).
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    # Real Postgres for migration + FTS tests; matches prod's PG 16 image.
    # Redis for session-revocation + rate-limit integration tests.
    # S3Storage integration tests use a generic container (RustFS).
    "testcontainers[postgres,redis]==4.9.0",
    # factory-boy is sync; the data-model test layer wraps it for AsyncSession.
    "factory-boy==3.3.1",
    # Sync driver for Alembic's "postgresql://" path and the migration
    # round-trip test; testcontainers does not pull it in.
    "psycopg2-binary==2.9.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openclef"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Function-scoped loop = one loop per test = engine fixture and test
# body share the same loop. The session-scoped sync fixtures (postgres
# container, alembic upgrade) don't need a loop at all.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# A test stuck this long dumps every thread's stack instead of hanging silently.
faulthandler_timeout = 120
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
