# OpenClef docs — minimal nginx config for serving Astro Starlight's static
# output. Astro emits directory-per-page (e.g. /brand/typography/index.html),
# so clean URLs work out of the box via try_files.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version in error pages and Server: headers.
    server_tokens off;

    # Pagefind search ships its own MIME types we want to serve correctly.
    types {
        application/wasm wasm;
        application/octet-stream pf_index;
        application/octet-stream pf_fragment;
        application/octet-stream pf_meta;
    }
    include /etc/nginx/mime.types;

    # Long-cache hashed assets; revalidate HTML on every request.
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
